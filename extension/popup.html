<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netflix Party Sync</title>
  <style>
    :root {
      --bg: #141414;
      --card: #1f1f1f;
      --primary: #E50914;
      --primary-hover: #F40612;
      --text: #FFFFFF;
      --muted: #AAAAAA;
      --border: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .logo-badge {
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    h2 {
      font-size: 15px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #2b2b2b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .room-row {
      display: flex;
      gap: 6px;
    }
    .room-row input {
      flex: 1;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-block {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      margin-top: 4px;
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
    }
    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover {
      color: #fff;
    }
    .status-msg {
      font-size: 11px;
      color: #46D369;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-badge">NPS</span>
    <h2>Netflix Party Sync</h2>
  </div>

  <div class="form-group">
    <label for="room-id">Room Code</label>
    <div class="room-row">
      <input type="text" id="room-id" placeholder="PARTY77">
      <button class="btn btn-secondary" id="btn-random" title="Generate Random Code">🎲</button>
    </div>
  </div>

  <div class="form-group">
    <label for="room-pass">Room Password (Secret)</label>
    <input type="password" id="room-pass" placeholder="•••••••• (optional or private)">
  </div>

  <div class="form-group">
    <label for="user-name">Your Display Name</label>
    <input type="text" id="user-name" placeholder="Alice">
  </div>

  <div class="form-group">
    <label for="server-url">Signaling Server (Default: Cloud)</label>
    <input type="text" id="server-url" value="cloud" placeholder="cloud (0 servers needed) or ws://...">
  </div>

  <div class="form-group" style="display: flex; gap: 16px; margin: 10px 0 14px;">
    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-size: 12px; color: #fff;">
      <input type="checkbox" id="check-mic" checked style="width: auto; margin: 0; cursor: pointer;"> 🎙️ Enable Mic
    </label>
    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-size: 12px; color: #fff;">
      <input type="checkbox" id="check-cam" checked style="width: auto; margin: 0; cursor: pointer;"> 📹 Enable Cam
    </label>
  </div>

  <button class="btn btn-block" id="btn-save">💾 Save & Join Room</button>

  <div style="font-size: 11px; color: #aaa; text-align: center; margin-top: 8px;">
    ⌨️ Resync Shortcut: <b style="color: #fff;">Alt + S</b> (Option + S)
  </div>

  <div class="status-msg" id="status-msg"></div>

  <div class="footer-links">
    <a href="http://localhost:8000/test_player.html" target="_blank">🎯 Open Test Player</a>
    <a href="https://www.netflix.com" target="_blank">🍿 Open Netflix</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
